allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Some plugins still compile against an old Android API (e.g.
// flutter_keyboard_visibility 6.0.0, pinned by html_editor_enhanced, uses 31),
// below what current AndroidX requires -- release builds then fail
// checkAarMetadata. Build those with the app's compileSdk instead. Registered
// before evaluationDependsOn(':app') below, which evaluates projects early.
subprojects { project ->
    if (project.path == ':app') return
    project.afterEvaluate {
        if (project.plugins.hasPlugin('com.android.library')) {
            def appCompileSdk = rootProject.project(':app').android.compileSdk
            if (project.android.compileSdk < appCompileSdk) {
                project.android.compileSdk = appCompileSdk
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
