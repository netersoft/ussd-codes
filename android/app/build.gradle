plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Not a standard Flutter-managed property: developers set this in their own
// local.properties (gitignored), so it's absent on fresh checkouts and CI.
def flutterMinSdkVersion = localProperties.getProperty('flutter.minSdkVersion')
if (flutterMinSdkVersion == null) {
    flutterMinSdkVersion = '24'
}

android {
    namespace "com.neteru.mobileussdcodex"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Same id as the legacy Java app on the Play Store, so this version
        // updates it (versionCode must stay above the legacy 12).
        applicationId "com.neteru.mobileussdcodex"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutterMinSdkVersion.toInteger()
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true
    }

    // AGP 9 turns resValue off by default; the flavors use it for app_name.
    buildFeatures {
        resValues true
    }

    // Lets dev/staging/prod builds install side by side on the same device
    // (distinct applicationId + app name) -- `flutter run --flavor dev`,
    // `flutter build apk --flavor staging --release`, etc. Environment
    // *configuration* (API URLs, keys) still comes from `.env`, provided at
    // build time same as today (see README > Build Flavors) -- flavors here
    // only separate app identity, not env content.
    flavorDimensions "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Codes USSD (Dev)"
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Codes USSD (Staging)"
        }
        prod {
            dimension "env"
            resValue "string", "app_name", "Codes USSD"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Falls back to the debug key when key.properties is absent (e.g. CI
            // smoke builds, or before a downstream project sets up real signing),
            // so `flutter build apk --release` keeps working out of the box.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug

            // R8: shrinks and obfuscates the code and strips unused resources.
            // Flutter's Gradle plugin and the plugins' own consumer rules supply
            // the keep rules they need.
            minifyEnabled true
            shrinkResources true
        }
        debug {
            minifyEnabled false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    // Play In-App Review, called from MainActivity (the in_app_review plugin
    // still applies kotlin-android, which breaks AGP 9 built-in Kotlin).
    implementation 'com.google.android.play:review:2.0.2'
}
