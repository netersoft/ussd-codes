name: flutter_starter
description: 'A reusable Flutter starter with auth, routing, local storage, i18n, REST API helpers, and common UI components.'
publish_to: 'none'

####################################################################################################

version: 1.0.0+1
# changelog generator : auto-changelog --template keepachangelog --hide-credit -v [version-name]

environment:
  sdk: '>=3.8.0 <4.0.0'

####################################################################################################

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  path: ^1.9.1
  intl: ^0.20.2
  http: ^1.6.0
  get_it: ^9.2.1
  lottie: ^3.4.0
  logger: ^2.7.0
  share_plus: ^13.2.0
  collection: ^1.19.1
  url_launcher: ^6.3.2
  flutter_phoenix: ^1.1.1
  json_annotation: ^4.12.0
  package_info_plus: ^10.2.0
  connectivity_plus: ^7.2.0
  flutter_easyloading: ^3.0.5
  introduction_screen: ^4.0.0
  shared_preferences: ^2.5.5
  flutter_native_splash: ^2.4.8 # dart run flutter_native_splash:create
  custom_refresh_indicator: ^4.0.1
  infinite_scroll_pagination: ^5.1.1
  flutter_dotenv: ^6.0.1
  go_router: ^17.3.0
  path_provider: ^2.1.6
  another_flutter_splash_screen: ^1.2.1
  settings_ui: ^3.0.1
  modal_bottom_sheet: ^3.0.0
  flutter_svg: ^2.3.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  flutter_keyboard_visibility: ^6.0.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.1
  flutter_form_builder: ^10.3.0+1
  form_builder_validators: ^11.3.0
  google_sign_in: ^7.2.0
  jwt_decoder: ^2.0.1
  phone_form_field: ^10.0.17
  pin_code_fields: ^9.4.0
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.4.0
  # Fork with AGP 9 built-in Kotlin support (upstream unmaintained since 3.1.4).
  video_compress:
    git:
      url: https://github.com/noeGnh/VideoCompress.git
      ref: caa8e7ebb17b5519d29a43b654d942e7236beaba
  device_info_plus: ^13.2.0
  app_set_id: ^1.4.0
  geocoding: ^4.0.0
  location: ^10.0.2
  permission_handler: ^12.0.3
  flutter_spinkit: ^5.2.2
  shimmer: ^3.0.0
  flutter_widget_from_html_core: ^0.17.2
  cached_network_image: ^3.4.1
  flutter_colorpicker: ^1.1.0
  cached_query_flutter: ^3.4.0
  cached_storage: ^3.3.0
  crypto: ^3.0.7
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  sign_in_with_apple: ^8.1.0
  injectable: ^3.0.0
  marionette_flutter: ^0.6.0
  html_editor_enhanced:
    git:
      url: https://github.com/noeGnh/html-editor-enhanced.git
      ref: fe8e4ecd0d4d747078286104ed620ec35db694c6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_analytics: ^12.4.5
  firebase_messaging: ^16.4.3

dependency_overrides:
  file_picker: ^12.0.0-beta.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.5
  build_runner: ^2.15.0 # dart run build_runner build --delete-conflicting-outputs
  flutter_lints: ^6.0.0
  icons_launcher: ^3.1.0 # dart run icons_launcher:create
  json_serializable: ^6.14.0
  rename_app: ^1.6.6 # dart run rename_app:main all="My App Name"
  riverpod_generator: ^4.0.4
  riverpod_lint: ^3.1.4
  hive_ce_generator: ^1.11.2
  injectable_generator: ^3.0.2
  go_router_builder: ^4.3.0
  change_app_package_name: ^1.5.0 # dart run change_app_package_name:main com.new.package.name
  marionette_mcp: ^0.6.0

####################################################################################################

# All icons launcher declinations have size 900x900
icons_launcher:
  image_path: assets/images/launcher/icon.png
  platforms:
    android:
      enable: true
      image_path: assets/images/launcher/icon.png
      # adaptive_background_color: '#ffffff'
      adaptive_background_image: assets/images/launcher/background.png
      adaptive_foreground_image: assets/images/launcher/foreground.png
      adaptive_round_image: assets/images/launcher/icon_round.png
      adaptive_monochrome_image: assets/images/launcher/icon_monochrome.png
    ios:
      enable: true
      image_path: assets/images/launcher/icon.png
    web:
      enable: true
      image_path: assets/images/launcher/icon.png
      favicon_path: assets/images/launcher/foreground.png
    macos:
      enable: true
      image_path: assets/images/launcher/icon.png
    windows:
      enable: false
      image_path: assets/images/launcher/icon.png
    linux:
      enable: false
      image_path: assets/images/launcher/icon.png

# Splash logo have size 1440x1440
flutter_native_splash:
  image: assets/images/launcher/splash_logo.png
  color: '#0000CD'
  #background_image: assets/background.png
  #branding: assets/dart.png
  image_dark: assets/images/launcher/splash_logo.png
  color_dark: '#262626'
  #background_image_dark: assets/dark_background.png
  #branding_dark: assets/dark_dart.png
  #branding_mode: bottom
  fullscreen: true
  android_12:
    image: assets/images/launcher/splash_logo.png
    icon_background_color: '#0000CD'
    color: '#0000CD'
    image_dark: assets/images/launcher/splash_logo.png
    icon_background_color_dark: '#262626'
    color_dark: '#262626'

flutter:
  uses-material-design: true

  assets:
    - .env
    #LAUNCHER
    - assets/images/launcher/splash_logo.png
    - assets/images/launcher/logo.png
    - assets/images/launcher/logo.svg
    - assets/images/launcher/logo_reverse.svg
    - assets/images/launcher/icon.png
    - assets/images/launcher/icon.jpg
    - assets/images/launcher/icon.svg
    - assets/images/launcher/icon_reverse.svg
    # IMAGES
    - assets/images/
    # ANIMATIONS
    - assets/animations/
    # I18N
    - assets/i18n/
    # DOCS
    - assets/docs/fr/
    - assets/docs/en/

  fonts:
    - family: proxima_nova
      fonts:
        - asset: assets/fonts/proxima_nova.otf

    - family: montserrat
      fonts:
        - asset: assets/fonts/montserrat/montserrat_italic.ttf
          style: italic
        - asset: assets/fonts/montserrat/montserrat_black.ttf
          weight: 900
        - asset: assets/fonts/montserrat/montserrat_extra_bold.ttf
          weight: 800
        - asset: assets/fonts/montserrat/montserrat_bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/montserrat_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/montserrat_medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/montserrat_regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/montserrat/montserrat_light.ttf
          weight: 300
        - asset: assets/fonts/montserrat/montserrat_extra_light.ttf
          weight: 200
        - asset: assets/fonts/montserrat/montserrat_thin.ttf
          weight: 100

    - family: open_sans
      fonts:
        - asset: assets/fonts/open_sans/open_sans_italic.ttf
          style: italic
        - asset: assets/fonts/open_sans/open_sans_extra_bold.ttf
          weight: 800
        - asset: assets/fonts/open_sans/open_sans_bold.ttf
          weight: 700
        - asset: assets/fonts/open_sans/open_sans_semi_bold.ttf
          weight: 600
        - asset: assets/fonts/open_sans/open_sans_regular.ttf
          style: normal
          weight: 400
        - asset: assets/fonts/open_sans/open_sans_light.ttf
          weight: 300
