# Deliberately NOT calling edpage-hq/.github's reusable flutter-test.yml: that
# workflow only runs `flutter pub get` + analyze/format/test, with no codegen
# (slang, build_runner) or .env creation step -- both required for this repo
# to even compile. Switch the `quality` job to call the reusable workflow
# once it grows optional inputs for a codegen command and an env file secret.
name: Flutter

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs
          dart format .

      - name: Create .env
        run: touch .env

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          flutter test --coverage

      # Generated files (*.g.dart, *.config.dart, firebase_options.dart) are
      # excluded from the count -- they're regenerated glue, not code this
      # repo's tests are meant to exercise. 10% is a floor below current
      # hand-written coverage (~14%), meant to catch regressions; raise it
      # as more tests are added rather than treating it as a target.
      - name: Enforce coverage floor
        run: |
          awk -v thresh=10 '
            /^SF:/ { file=$0; sub("^SF:", "", file); skip = (file ~ /\.g\.dart$/ || file ~ /\.config\.dart$/ || file ~ /firebase_options\.dart$/) }
            /^LF:/ { n=$0; sub("^LF:", "", n); if (!skip) lf += n }
            /^LH:/ { n=$0; sub("^LH:", "", n); if (!skip) lh += n }
            END {
              pct = (lf > 0) ? (lh / lf * 100) : 0
              printf "Hand-written line coverage: %.2f%% (%d/%d), floor is %d%%\n", pct, lh, lf, thresh
              if (pct + 0 < thresh) exit 1
            }
          ' coverage/lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: coverage/lcov.info
          retention-days: 14

  build-android:
    name: Build Android APK
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # Signed with the debug key unless the project has its own key.properties +
      # keystore configured (see android/app/build.gradle). Good enough to smoke-test
      # that Android release builds succeed and to hand out for manual QA; a real
      # release keystore is required before publishing to the Play Store.
      # --flavor prod: a tagged release is a production build (see README >
      # Build Flavors) -- also doubles as CI coverage for the flavor setup itself.
      - name: Build release APK
        run: flutter build apk --release --flavor prod

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS (unsigned)
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs

      - name: Create .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      # No code signing available for a shared starter template (that requires a
      # real Apple Developer account/certificates), so this only proves the iOS
      # side still compiles -- it does not produce an installable/distributable
      # .ipa. Add signing (Fastlane match, App Store Connect API key, etc.) once
      # a downstream project has its own Apple Developer credentials.
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign
